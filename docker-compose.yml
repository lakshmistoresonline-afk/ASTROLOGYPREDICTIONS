version: "3.9"

services:
  kundli:
    build: .
    container_name: jyotish-dashboard
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - SE_EPHE_PATH=/app/ephe
      - FLASK_ENV=production
      - PORT=5000
      - CALC_SERVICE_URL=http://calculation-service:8000
    volumes:
      - ephe_data:/app/ephe
      - app_data:/app/data
    restart: unless-stopped
    depends_on:
      - calculation-service

  calculation-service:
    build: ./calculation_service
    container_name: jyotish-calc-service
    ports:
      - "8000:8000"
    environment:
      - SE_EPHE_PATH=/app/ephe
    volumes:
      - ephe_data:/app/ephe
    restart: unless-stopped

volumes:
  ephe_data:
  app_data:
