<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure UPI Checkout — Astro Predictions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0b091a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; font-size: 18px; line-height: 1.75; }
        .card-custom { background: #15102a; border: 2px solid #3b2a75; border-radius: 20px; padding: 45px; color: #fff; max-width: 650px; margin: 40px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-gold { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #0b091a; font-weight: 700; border-radius: 35px; padding: 14px 30px; border: none; width: 100%; font-size: 1.15rem; }
        .btn-gold:hover { opacity: 0.95; color: #0b091a; }
        .qr-box { background: #fff; padding: 20px; border-radius: 10px; display: inline-block; margin: 15px 0; }
        p, span, label { color: #f8fafc !important; font-size: 1.15rem; }
        .form-control { background-color: #0b091a !important; color: #ffffff !important; border: 2px solid #4c3596 !important; padding: 12px 16px; font-size: 1.1rem; }
        .form-control:focus { border-color: #FFD700 !important; box-shadow: 0 0 0 0.25rem rgba(255,215,0,0.25); }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="card-custom shadow-lg">
            <h2 class="h3 fw-bold mb-3 text-warning"><i class="fas fa-shield-alt me-2"></i>Complete UPI Payment</h2>
            <p class="mb-2 fs-5" style="color: #cbd5e1 !important;">Product: <strong class="text-white">{{ product_id }}</strong></p>
            <h3 class="fw-bold mb-4 text-warning fs-3">Amount: ₹{{ amount }}</h3>

            <div class="text-center mb-4 p-4 bg-dark rounded-4 border border-secondary">
                <p class="mb-2 fs-5" style="color: #cbd5e1 !important;">Scan QR or pay via UPI ID:</p>
                <div class="bg-black p-3 rounded border border-warning text-warning fw-bold fs-4 mb-3">
                    {{ settings.upi_id }}
                </div>
                <p class="fs-5 mb-2" style="color: #cbd5e1 !important;">Payee: <strong class="text-white">{{ settings.payee_name }}</strong></p>
                {% if settings.qr_code_url %}
                <div class="qr-box">
                    <img src="{{ settings.qr_code_url }}" alt="UPI QR Code" style="max-width: 200px;">
                </div>
                {% endif %}
                <p class="fs-6 mt-3 px-3" style="color: #94a3b8 !important;">{{ settings.instructions }}</p>
            </div>

            <hr class="border-secondary my-4">

            <form action="/payment/submit-proof" method="POST">
                <input type="hidden" name="order_id" value="{{ order.id }}">
                <div class="mb-4">
                    <label class="form-label text-light fs-5 fw-semibold mb-2">Enter UTR / Transaction Reference Number</label>
                    <input type="text" name="utr_number" class="form-control" required placeholder="e.g. 325419827361">
                    <div class="form-text text-light opacity-75 mt-2">Enter the 12-digit UTR or reference number from your UPI payment app.</div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-gold py-3"><i class="fas fa-check-circle me-2"></i>I Have Paid — Submit UTR for Verification</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
