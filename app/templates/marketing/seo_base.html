<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default("Astro Predictions — Vedic Astrology Intelligence") }}</title>
    <meta name="description" content="{{ description | default('Explore Vedic astrology intelligence and exact birth chart calculations.') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0b091a; color: #f1f1f1; font-family: 'Segoe UI', sans-serif; line-height: 1.7; }
        .content-wrap { padding: 80px 0; max-width: 800px; margin: 0 auto; }
        .btn-gold { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #0b091a; font-weight: bold; border-radius: 30px; padding: 10px 25px; }
        a { color: #FFD700; }
        h1, h2, h3 { color: #FFD700; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/welcome"><i class="fas fa-star-of-life me-2"></i>Astro Predictions</a>
            <div class="ms-auto"><a href="/birth-chart" class="btn btn-outline-warning btn-sm rounded-pill px-3">Free Chart</a></div>
        </div>
    </nav>
    <div class="container content-wrap">
        {% block content %}{% endblock %}
        <hr class="my-5 border-secondary">
        <div class="text-center">
            <h4 class="text-warning mb-3">Ready to explore your personal Vedic chart?</h4>
            <a href="/birth-chart" class="btn btn-gold btn-lg me-2">Create Free Chart</a>
            <a href="/download" class="btn btn-outline-light btn-lg rounded-pill">Get Android App</a>
        </div>
    </div>
</body>
</html>
