<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ share.title }}</title>
    <meta name="description" content="{{ share.description }}">
    <meta property="og:title" content="{{ share.title }}">
    <meta property="og:description" content="{{ share.description }}">
    <meta property="og:image" content="{{ share.image }}">
    <meta property="og:url" content="{{ share.url }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0b091a; color: #f1f1f1; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card-share { background: #15102a; border: 1px solid #2d2254; border-radius: 20px; padding: 40px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-gold { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #0b091a; font-weight: bold; border: none; padding: 12px 30px; border-radius: 30px; }
    </style>
</head>
<body>
    <div class="card-share">
        <span class="badge bg-warning text-dark mb-3 px-3 py-2 rounded-pill fw-bold">Astro Predictions Insight</span>
        <h1 class="h3 fw-bold mb-3">Vedic Astrology Intelligence</h1>
        <p class="text-muted mb-4">{{ share.description }}</p>
        <div class="d-grid gap-2">
            <a href="/birth-chart" class="btn btn-gold btn-lg"><i class="fas fa-chart-pie me-2"></i>Explore Your Free Birth Chart</a>
            <a href="/welcome" class="btn btn-outline-light btn-sm rounded-pill">Learn More About Astro Predictions</a>
        </div>
    </div>
</body>
</html>
