<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication — Jyotish OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
          --bg-dark: #0a0c16;
          --card-bg: #131728;
          --accent-gold: #f59e0b;
          --accent-gold-hover: #d97706;
          --border-color: #232a45;
          --text-main: #f3f4f6;
          --text-muted: #9ca3af;
        }

        body {
          background-color: var(--bg-dark);
          color: var(--text-main);
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          margin: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }

        /* Redesigned Card Container */
        .auth-card {
          background: var(--card-bg);
          border: 1px solid var(--border-color);
          border-radius: 16px;
          padding: 2.5rem;
          width: 100%;
          max-width: 420px;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
          text-align: center;
        }

        /* Brand Header */
        .brand-title {
          color: var(--accent-gold);
          font-size: 1.75rem;
          font-weight: 700;
          margin-bottom: 0.5rem;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.5rem;
        }

        /* Primary Accent Buttons */
        .btn-primary {
          background-color: var(--accent-gold);
          color: #000000;
          font-weight: 600;
          border: none;
          padding: 0.75rem 1.5rem;
          border-radius: 8px;
          width: 100%;
          cursor: pointer;
          transition: all 0.2s ease-in-out;
          margin-bottom: 1rem;
        }

        .btn-primary:hover {
          background-color: var(--accent-gold-hover);
          transform: translateY(-1px);
        }

        /* Secondary Buttons */
        .btn-secondary {
          background-color: transparent;
          color: var(--text-main);
          border: 1px solid var(--border-color);
          font-weight: 500;
          padding: 0.75rem 1.5rem;
          border-radius: 8px;
          width: 100%;
          cursor: pointer;
          transition: all 0.2s ease-in-out;
        }

        .btn-secondary:hover {
          background-color: rgba(255, 255, 255, 0.05);
          border-color: var(--text-muted);
        }

        /* Form Inputs */
        .form-input {
          width: 100%;
          padding: 0.75rem 1rem;
          background-color: var(--bg-dark);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          color: var(--text-main);
          margin-bottom: 1rem;
          box-sizing: border-box;
        }

        .form-input:focus {
          outline: none;
          border-color: var(--accent-gold);
        }
    </style>
</head>
<body>
    <div class="auth-card">
      <div class="brand-title">
        <span>✨</span> Jyotish OS
      </div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
        Enterprise Astrological Prediction Engine
      </p>

      <form method="POST" action="/login">
        <button type="submit" name="user_type" value="tester" class="btn-primary">
          Sign in as Standard Tester
        </button>

        <button type="submit" name="user_type" value="admin" class="btn-secondary">
          Sign in as Administrator
        </button>
      </form>

      <div style="margin-top: 1.5rem; font-size: 0.75rem; color: var(--text-muted);">
        Developer Preview Login • Standard security protocols bypassed for testing.
      </div>
    </div>
</body>
</html>
