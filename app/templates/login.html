<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication — Jyotish OS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0b091a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #15102a; border: 2px solid #3b2a75; border-radius: 20px; padding: 50px; width: 100%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .btn-gold { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #0b091a; font-weight: 700; border: none; padding: 14px; border-radius: 12px; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-gold:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 2px solid #3b2a75; color: #f8fafc; padding: 14px; border-radius: 12px; width: 100%; margin-top: 10px; }
        .btn-outline:hover { background: #1e1342; border-color: #FFD700; }
        .logo { color: #FFD700; font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 30px; }
        .info-text { color: #94a3b8; font-size: 0.95rem; text-align: center; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="fas fa-star-of-life me-2"></i>Jyotish OS</div>
        <h4 class="text-center mb-4">System Authentication</h4>

        <form method="POST">
            <input type="hidden" name="role" value="user">
            <button type="submit" class="btn btn-gold">
                <i class="fas fa-user-check me-2"></i>Sign in as Standard Tester
            </button>
        </form>

        <form method="POST">
            <input type="hidden" name="role" value="admin">
            <button type="submit" class="btn btn-outline">
                <i class="fas fa-user-shield me-2"></i>Sign in as Administrator
            </button>
        </form>

        <div class="info-text">
            This is a <strong>Developer Preview</strong> login. <br>
            Standard security protocols are bypassed to enable <br>
            full feature testing and architectural audit.
        </div>

        <div class="text-center mt-4">
            <a href="/" class="text-decoration-none" style="color: #64748b; font-size: 0.9rem;">
                <i class="fas fa-arrow-left me-1"></i> Return to Welcome Page
            </a>
        </div>
    </div>
</body>
</html>
