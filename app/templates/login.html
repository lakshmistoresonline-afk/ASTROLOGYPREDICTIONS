{% extends "base.html" %}
{% block title %}Authentication — Astro Predictions Dark Celestial OS{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-75 py-5">
  <!-- GLASSMORPHIC AUTHENTICATION CARD -->
  <div class="card-glass p-4 p-md-5 border-white border-opacity-10 shadow-2xl rounded-4 text-center max-w-md w-100 position-relative overflow-hidden">
    <!-- Ambient Radial Glow -->
    <div class="glow-orb" style="width: 300px; height: 300px; top: -100px; right: -100px; opacity: 0.2"></div>

    <div class="position-relative z-1">
      <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.75rem;">ॐ</div>

      <h2 class="font-premium text-white fw-bold fs-3 mb-1">Jyotish OS</h2>
      <p class="text-dim xsmall mb-4 font-mono">Enterprise Astrological Prediction Engine V3.36</p>

      <form method="POST" action="/login" class="space-y-3 mb-3">
        <button type="submit" name="user_type" value="tester" class="btn btn-vedic w-100 py-3 fw-bold shadow-lg mb-3">
          <i class="bi bi-person-check-fill me-2"></i> Sign in as Standard Tester (Subramanian T S)
        </button>

        <button type="submit" name="user_type" value="admin" class="btn btn-outline-glass w-100 py-3 font-mono">
          <i class="bi bi-shield-lock-fill me-2"></i> Sign in as Administrator
        </button>
      </form>

      <div class="pt-3 border-top border-white border-opacity-10 xxsmall text-dim font-mono">
        Developer Preview Login • Standard security protocols bypassed for full feature testing.
      </div>
    </div>
  </div>
</div>
{% endblock %}
