{% extends "base.html" %}
{% block title %}Create Profile — Astro Predictions{% endblock %}

{% block content %}
<div class="row justify-content-center pt-2 pb-5">
    <div class="col-lg-6">
        <div class="card-premium p-4 p-md-5 bg-glass shadow-2xl position-relative overflow-hidden" style="border-radius: 28px;">
            <div class="glow-orb" style="width: 350px; height: 350px; top: -100px; right: -100px; opacity: 0.15"></div>

            <div class="position-relative z-index-1">
                <div class="text-center mb-5">
                    <div class="badge bg-gold text-dark mb-3 fw-black px-3 py-2 xsmall tracking-widest rounded-pill">ONBOARDING</div>
                    <h2 class="font-premium text-white fw-black mb-2">Create Your Life Profile</h2>
                    <p class="text-dim xsmall">Enter your precise birth particulars for deterministic Swiss Ephemeris calculation.</p>
                </div>

                <form action="{{ url_for('main.kundli') }}" method="POST" id="kundli-form">
                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label-vedic xsmall text-uppercase opacity-70">Full Name</label>
                            <input type="text" name="name" class="form-control-vedic py-3 fs-6 rounded-4" placeholder="e.g. Subramanian T S" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-vedic xsmall text-uppercase opacity-70">Birth Date (DD/MM/YYYY)</label>
                            <input type="text" id="dob-display" class="form-control-vedic py-3 rounded-4 font-mono" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off" required/>
                            <input type="hidden" name="dob" id="dob-canonical"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-vedic xsmall text-uppercase opacity-70">Birth Time (24h)</label>
                            <input type="time" name="tob" class="form-control-vedic py-3 rounded-4" required step="60"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label-vedic xsmall text-uppercase opacity-70">Birth Location</label>
                            <input type="text" name="place" id="place-input" class="form-control-vedic py-3 rounded-4" placeholder="Search city, town or village..." required/>
                        </div>

                        <input type="hidden" name="lat" id="lat-input"/>
                        <input type="hidden" name="lon" id="lon-input"/>
                        <input type="hidden" name="timezone" id="tz-input"/>

                        <div class="col-12 pt-3">
                            <button type="submit" class="btn btn-vedic w-100 py-3 fw-black fs-6 shadow-lg rounded-pill">CALCULATE BLUEPRINT & FORECAST</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const displayInput = document.getElementById('dob-display');
    const canonicalInput = document.getElementById('dob-canonical');

    if (displayInput && canonicalInput) {
        displayInput.addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length >= 2 && v.length <= 4) {
                v = v.slice(0,2) + '/' + v.slice(2);
            } else if (v.length > 4) {
                v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4,8);
            }
            e.target.value = v;

            if (v.length === 10) {
                const parts = v.split('/');
                if (parts.length === 3) {
                    const day = parts[0], month = parts[1], year = parts[2];
                    const dNum = parseInt(day, 10), mNum = parseInt(month, 10), yNum = parseInt(year, 10);
                    if (mNum >= 1 && mNum <= 12 && dNum >= 1 && dNum <= 31 && yNum >= 1000 && yNum <= 9999) {
                        canonicalInput.value = `${year}-${month}-${day}`;
                    } else {
                        canonicalInput.value = '';
                    }
                }
            } else {
                canonicalInput.value = '';
            }
        });

        const form = displayInput.closest('form');
        if (form) {
            form.addEventListener('submit', function(e) {
                if (!canonicalInput.value) {
                    e.preventDefault();
                    alert('Please enter a valid birth date in DD/MM/YYYY format.');
                    displayInput.focus();
                }
            });
        }
    }
});
</script>
{% endblock %}
