name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Download Swiss Ephemeris data
      run: |
        mkdir -p ephe
        curl -L https://github.com/aloistr/swisseph/raw/master/ephe/seas_18.se1 -o ephe/seas_18.se1
        curl -L https://github.com/aloistr/swisseph/raw/master/ephe/semo_18.se1 -o ephe/semo_18.se1
        curl -L https://github.com/aloistr/swisseph/raw/master/ephe/sepl_18.se1 -o ephe/sepl_18.se1
        
    - name: Run tests
      env:
        SE_EPHE_PATH: ${{ github.workspace }}/ephe
      run: |
        pytest tests/
