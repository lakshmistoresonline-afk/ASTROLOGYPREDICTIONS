version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://astro:secret@postgres:5432/astrodb
      - FLASK_ENV=production
    depends_on:
      - redis
      - postgres

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.report_generation_worker worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://astro:secret@postgres:5432/astrodb
    depends_on:
      - redis
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=astro
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=astrodb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru

volumes:
  postgres_data:
