# Multi-Region Active-Active Helm Values (US-East)
region: us-east1
replicaCount: 4

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 32
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: "nginx"
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    external-dns.alpha.kubernetes.io/hostname: "us-east.astropredictions.com"

env:
  REGION_ID: "US-EAST-1"
  REDIS_URL: "redis://redis-us-east.cache.internal:6379/0"
  POSTGRES_URL: "postgresql://astro:secret@pg-us-east.db.internal:5432/astrodb"
